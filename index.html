<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Workspace</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f2efe9;
            background-image: radial-gradient(#d4ceb8 1px, transparent 1px);
            background-size: 24px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #2c3531;
        }

        /* Bento Grid Wrapper Structure */
        .bento-layout {
            display: grid;
            grid-template-columns: 1fr 2.5fr;
            grid-template-rows: auto 1fr auto;
            width: 90%;
            max-width: 950px;
            height: 80vh;
            gap: 16px;
        }

        .grid-item {
            background-color: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(44, 53, 49, 0.08);
            border-radius: 20px;
            padding: 24px;
        }

        /* Module 1: Header Branding Block */
        .header-card {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 28px;
            border-bottom: 2px solid #3b7a57;
        }

        .header-card h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #2c3531;
            text-transform: uppercase;
        }

        .engine-badge {
            font-size: 0.75rem;
            background-color: #e5ede9;
            color: #3b7a57;
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 600;
            border: 1px solid rgba(59, 122, 87, 0.15);
        }

        /* Module 2: System Status Metrics Sidebar */
        .sidebar-card {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .meta-group {
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding-bottom: 14px;
        }

        .meta-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #7a827e;
            font-weight: 700;
            letter-spacing: 0.8px;
            margin-bottom: 4px;
        }

        .meta-value {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c3531;
        }

        /* Module 3: Active Main Canvas Stream */
        .stream-card {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            gap: 20px;
            background: #ffffff;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.02);
        }

        .stream-card::-webkit-scrollbar {
            width: 5px;
        }

        .stream-card::-webkit-scrollbar-thumb {
            background: #d4ceb8;
            border-radius: 10px;
        }

        .block {
            max-width: 85%;
            padding: 14px 20px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-block {
            align-self: flex-end;
            background-color: #3b7a57;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .bot-block {
            align-self: flex-start;
            background-color: #f7f6f0;
            color: #2c3531;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        /* Module 4: Integrated Utility Control Input Tray */
        .input-card {
            grid-column: 1 / -1;
            display: flex;
            gap: 12px;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 14px 20px;
            align-items: center;
        }

        #userInput {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 0.95rem;
            color: #2c3531;
            padding: 4px;
        }

        #userInput::placeholder {
            color: #a3a9a6;
        }

        #sendBtn {
            background-color: #2c3531;
            color: #f2efe9;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        #sendBtn:hover {
            background-color: #3b7a57;
        }

        #sendBtn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="bento-layout">
        <!-- Header -->
        <div class="grid-item header-card">
            <h1>Workspace Terminal</h1>
            <div class="engine-badge">gemini-2.5-flash</div>
        </div>

        <!-- Sidebar Metadata Panel -->
        <div class="grid-item sidebar-card">
            <div class="meta-group">
                <div class="meta-label">Environment Target</div>
                <div class="meta-value">Localhost (8000)</div>
            </div>
            <div class="meta-group">
                <div class="meta-label">Node Instance</div>
                <div class="meta-value">FastAPI Engine</div>
            </div>
            <div class="meta-group">
                <div class="meta-label">Connection Status</div>
                <div class="meta-value" style="color: #3b7a57; font-weight: bold;">Synchronized</div>
            </div>
        </div>

        <!-- Conversational Stream Canvas -->
        <div class="grid-item stream-card" id="chatBox">
            <div class="block bot-block" style="background-color: transparent; border: none; padding: 0; color: #7a827e; font-size: 0.85rem;">
                System channel successfully initialized. Ready to receive workspace stream data...
            </div>
        </div>

        <!-- Input Tray -->
        <div class="grid-item input-card">
            <input type="text" id="userInput" placeholder="Type data stream instruction or question..." autocomplete="off">
            <button id="sendBtn">Execute</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('block', sender === 'user' ? 'user-block' : 'bot-block');
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';

            const botMessageElement = appendMessage('Connecting to engine...', 'bot');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) throw new Error('Server disconnect');
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                botMessageElement.textContent = ''; // Clear connection indicator
                
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    // Directly append the raw string chunk instantly to the interface
                    botMessageElement.textContent += decoder.decode(value, { stream: true });
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            } catch (error) {
                botMessageElement.textContent = 'Connection Error: Stream pipeline interrupted.';
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
